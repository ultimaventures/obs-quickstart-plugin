name: Check For Changed Files
description: Checks for changed files compared to specific git reference and glob expression
inputs:
  baseRef:
    description: Git reference to check against
    required: false
  ref:
    description: Git reference to check with
    required: false
    default: HEAD
  checkGlob:
    description: Glob expression to limit check to specific files
    required: false
  useFallback:
    description: Use fallback compare against prior commit
    required: false
    default: 'true'
  diffFilter:
    description: git diff-filter string to use
    required: false
    default: ''
outputs:
  hasChangedFiles:
    value: ${{ steps.checks.outputs.hasChangedFiles }}
    description: True if specified files were changed in comparison to specified git reference
  changedFiles:
    value: ${{ steps.checks.outputs.changedFiles }}
    description: List of changed files
runs:
  using: composite
  steps:
    - name: Check For Changed Files ✅
      shell: bash
      id: checks
      env:
        GIT_BASE_REF: ${{ inputs.baseRef }}
        GIT_REF: ${{ inputs.ref }}
        GITHUB_EVENT_FORCED: ${{ github.event.forced }}
        GITHUB_REF_BEFORE: ${{ github.event.before }}
        USE_FALLBACK: ${{ inputs.useFallback }}
        DIFF_FILTER: ${{ inputs.diffFilter }}
      run: |
        : Check for Changed Files ✅
        if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
        shopt -s extglob
        shopt -s dotglob

        if [[ "${GIT_BASE_REF}" ]]; then
          if ! git cat-file -e "${GIT_BASE_REF}" &> /dev/null; then
            echo "::warning::Provided base reference ${GIT_BASE_REF} is invalid"
            if [[ "${USE_FALLBACK}" == 'true' ]]; then
              GIT_BASE_REF='HEAD~1'
            fi
          fi
        else
          new_branch=false
          if ! git cat-file -e ${GITHUB_REF_BEFORE} &> /dev/null; then
            GITHUB_REF_BEFORE='4b825dc642cb6eb9a060e54bf8d69288fbee4904'
            new_branch=true
          fi

          GIT_BASE_REF='HEAD~1'
          case "${GITHUB_EVENT_NAME}" in
            pull_request) GIT_BASE_REF="origin/${GITHUB_BASE_REF}" ;;
            push)
              if [[ "${GITHUB_EVENT_FORCED}" != 'true' ]]; then
                if [[ "${new_branch}" == 'true' ]]; then
                  # New branch pushed (e.g. via remote mirror): diff against
                  # the default branch instead of the empty tree, so only
                  # this branch's own changes are checked.
                  # NOTE: actions/checkout does not create refs/remotes/origin/HEAD,
                  # so the symbolic-ref lookup can fail — never let it abort the
                  # script (bash -e -o pipefail is active), and verify the
                  # resulting ref exists before diffing against it.
                  default_branch=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || true)
                  GIT_BASE_REF="origin/${default_branch:-main}"
                  if ! git cat-file -e "${GIT_BASE_REF}" &> /dev/null; then
                    echo "::warning::Default branch ref ${GIT_BASE_REF} not found; falling back to empty-tree diff"
                    GIT_BASE_REF='4b825dc642cb6eb9a060e54bf8d69288fbee4904'
                  fi
                else
                  GIT_BASE_REF="${GITHUB_REF_BEFORE}"
                fi
              fi
              ;;
            *) ;;
          esac
        fi

        changes=($(git diff --name-only --diff-filter="${DIFF_FILTER}" ${GIT_BASE_REF} ${GIT_REF} -- ${{ inputs.checkGlob }}))

        if (( ${#changes[@]} )); then
          file_string="${changes[*]}"
          echo "hasChangedFiles=true" >> $GITHUB_OUTPUT
          echo "changedFiles=[\"${file_string// /\",\"}\"]" >> $GITHUB_OUTPUT
        else
          echo "hasChangedFiles=false" >> $GITHUB_OUTPUT
          # Fixed 2026-09-30: was `>> GITHUB_OUTPUT` (missing `$`) — wrote a
          # stray file named GITHUB_OUTPUT instead of the step output, leaving
          # changedFiles unset. This action now diverges from the vendored
          # template; preserve this fix when re-vendoring check-changes.
          echo "changedFiles=[]" >> $GITHUB_OUTPUT
        fi
