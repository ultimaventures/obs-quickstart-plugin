name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
      - 'ci/**'
      - 'ready/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main' || startsWith(github.ref_name, 'ci/') || startsWith(github.ref_name, 'ready/')
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

  post-gate-status:
    name: Post Gate Status to GitLab 📮
    # Always report back, even when builds fail: the GitLab-side `pending`
    # status (posted by .gitlab-ci.yml) must be resolved to failed, otherwise
    # the merge gate would stay pending forever on a red build.
    if: always()
    needs: [check-format, build-project, create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Post commit status to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_STATUS_TOKEN: ${{ secrets.GITLAB_STATUS_TOKEN }}
        run: |
          : Post commit status to GitLab
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          python3 - <<'PYEOF'
          import json, os, sys, urllib.parse, urllib.request

          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          sha = os.environ["GITHUB_SHA"]
          gh_token = os.environ["GITHUB_TOKEN"]
          gl_token = os.environ.get("GITLAB_STATUS_TOKEN", "")

          if not gl_token:
              sys.exit("error: GITLAB_STATUS_TOKEN secret is not set; "
                       "refusing to leave the gate status unresolved")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
              headers={"Authorization": f"Bearer {gh_token}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          jobs = json.load(urllib.request.urlopen(req))["jobs"]

          failed, cancelled = [], []
          for job in jobs:
              conclusion = job.get("conclusion")
              if not conclusion:
                  continue  # still running; only this postback job at this point
              name = job["name"].split(" / ")[-1]
              if conclusion in ("failure", "timed_out", "action_required"):
                  failed.append(name)
              elif conclusion in ("cancelled", "stale"):
                  cancelled.append(name)

          if failed:
              state, description = "failed", "Failed: " + ", ".join(failed)
          elif cancelled:
              state, description = "canceled", "Cancelled: " + ", ".join(cancelled)
          else:
              state, description = "success", "All 3 OS builds and checks passed"
          description = description[:250]

          # The status `name` MUST match the pending post in .gitlab-ci.yml.
          payload = urllib.parse.urlencode({
              "state": state,
              "name": "github/3os-build",
              "target_url": f"{server_url}/{repo}/actions/runs/{run_id}",
              "description": description,
          }).encode()

          req = urllib.request.Request(
              "https://gitlab.com/api/v4/projects/79480971/statuses/" + sha,
              data=payload, headers={"PRIVATE-TOKEN": gl_token})
          with urllib.request.urlopen(req) as resp:
              body = json.load(resp)
          print(f"posted gate status '{body['status']}' for {sha[:9]}: {description}")
          PYEOF
