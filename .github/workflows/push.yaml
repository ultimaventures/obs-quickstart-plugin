name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
      - 'ci/**'
      - 'ready/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main' || startsWith(github.ref_name, 'ci/') || startsWith(github.ref_name, 'ready/')
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(alpha|beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Reject Invalid Tag 🛑
        # A mistagged push (e.g. v0.1.0-alpha1 with a 'v' prefix) must fail
        # loudly, not go green with no release. Valid tags are 0.1.0 or
        # 0.1.0-alpha1 (no 'v' prefix); see the case patterns above.
        if: github.ref_type == 'tag' && !fromJSON(steps.check.outputs.validTag)
        run: |
          echo "error: tag '${GITHUB_REF_NAME}' is not a valid release tag." >&2
          echo "Use 0.1.0 for stable or 0.1.0-alpha1 / 0.1.0-beta1 / 0.1.0-rc1 for prereleases (no 'v' prefix)." >&2
          exit 1

      - name: Checkout for Guard 🛒
        # The stable-release guard greps src/, so the tree must be present.
        if: fromJSON(steps.check.outputs.validTag) && !fromJSON(steps.check.outputs.prerelease)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard Stable Release Hooks 🛡️
        # The "OBS Setup Test" menu hooks are tester scaffolding: they may
        # ship in prerelease (alpha/beta/rc) tags, but must never reach a
        # stable release. Fail closed on stable tags.
        if: fromJSON(steps.check.outputs.validTag) && !fromJSON(steps.check.outputs.prerelease)
        run: |
          : Guard Stable Release Hooks 🛡️
          # Defense in depth: if the checkout above is ever removed, the
          # guard must fail rather than silently pass on a missing src/.
          # Note: this job uses bash -e, so capture grep's exit code
          # explicitly — a bare grep returning 1 (no match) would abort
          # the script before the case runs.
          test -d src || { echo "error: src/ missing; refusing to pass the guard" >&2; exit 1; }
          rc=0
          grep -r "OBS Setup Test" src/ --include="*.cpp" --include="*.hpp" || rc=$?
          case $rc in
            0) echo "error: 'OBS Setup Test' hook found in src/ on a stable tag; remove it before releasing" >&2; exit 1 ;;
            1) echo "No test hooks in src/; stable release guard passed." ;;
            *) echo "error: grep failed; refusing to pass the guard" >&2; exit 1 ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

  post-gate-status:
    name: Post Gate Status to GitLab 📮
    # Always report back, even when builds fail: the GitLab-side `pending`
    # status (posted by .gitlab-ci.yml) must be resolved to failed, otherwise
    # the merge gate would stay pending forever on a red build.
    if: always()
    needs: [check-format, build-project, create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Post commit status to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_STATUS_TOKEN: ${{ secrets.GITLAB_STATUS_TOKEN }}
        run: |
          : Post commit status to GitLab
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.parse, urllib.request
          import urllib.error

          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          sha = os.environ["GITHUB_SHA"]
          gh_token = os.environ["GITHUB_TOKEN"]
          gl_token = os.environ.get("GITLAB_STATUS_TOKEN", "")

          if not gl_token:
              sys.exit("error: GITLAB_STATUS_TOKEN secret is not set; "
                       "refusing to leave the gate status unresolved")

          def fetch_json(req, tries=3):
              """GET with timeout and retry on timeout/5xx (fail-closed)."""
              last_exc = None
              for attempt in range(tries):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          if resp.status >= 500:
                              raise urllib.error.HTTPError(
                                  req.full_url, resp.status, "server error",
                                  resp.headers, None)
                          return json.load(resp)
                  except (urllib.error.URLError, TimeoutError,
                          urllib.error.HTTPError) as exc:
                      last_exc = exc
                      # Retry only on timeout or 5xx; 4xx is fail-closed.
                      status = getattr(exc, "code", None)
                      if status is not None and status < 500:
                          raise
                      if attempt < tries - 1:
                          time.sleep(2 ** attempt)
              raise last_exc

          def post_status(payload, tries=3):
              """POST with timeout and retry on timeout/5xx (fail-closed)."""
              last_exc = None
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(
                          "https://gitlab.com/api/v4/projects/79480971/statuses/" + sha,
                          data=payload, headers={"PRIVATE-TOKEN": gl_token})
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          if resp.status >= 500:
                              raise urllib.error.HTTPError(
                                  req.full_url, resp.status, "server error",
                                  resp.headers, None)
                          return json.load(resp)
                  except (urllib.error.URLError, TimeoutError,
                          urllib.error.HTTPError) as exc:
                      last_exc = exc
                      status = getattr(exc, "code", None)
                      if status is not None and status < 500:
                          raise
                      if attempt < tries - 1:
                          time.sleep(2 ** attempt)
              raise last_exc

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
              headers={"Authorization": f"Bearer {gh_token}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          jobs = fetch_json(req)["jobs"]

          failed, cancelled = [], []
          os_results = {}
          for job in jobs:
              conclusion = job.get("conclusion")
              if not conclusion:
                  continue  # still running; only this postback job at this point
              name = job["name"].split(" / ")[-1]
              if conclusion in ("failure", "timed_out", "action_required"):
                  failed.append(name)
              elif conclusion in ("cancelled", "stale"):
                  cancelled.append(name)
              # Track per-OS build results explicitly; a skipped or missing
              # OS build must not be reported as a passing gate. Collect
              # every matching job — all must succeed, not just the last.
              for os_name in ("Build for Windows", "Build for macOS",
                              "Build for Ubuntu"):
                  if os_name in name:
                      os_results.setdefault(os_name, []).append(conclusion)

          if failed:
              state, description = "failed", "Failed: " + ", ".join(failed)
          elif cancelled:
              state, description = "canceled", "Cancelled: " + ", ".join(cancelled)
          else:
              # Vacuous-success guard: every OS build must have an explicit
              # success; a skipped or absent build fails the gate instead of
              # being reported as green.
              missing = [os_name for os_name in
                         ("Build for Windows", "Build for macOS",
                          "Build for Ubuntu")
                         if not os_results.get(os_name)
                         or any(c != "success"
                                for c in os_results[os_name])]
              if missing:
                  state = "failed"
                  description = ("Failed: missing or unsuccessful OS build(s): "
                                 + ", ".join(missing))
              else:
                  state, description = "success", "All 3 OS builds and checks passed"
          description = description[:250]

          # The status `name` MUST match the pending post in .gitlab-ci.yml.
          payload = urllib.parse.urlencode({
              "state": state,
              "name": "github/3os-build",
              "target_url": f"{server_url}/{repo}/actions/runs/{run_id}",
              "description": description,
          }).encode()

          body = post_status(payload)
          print(f"posted gate status '{body['status']}' for {sha[:9]}: {description}")
          PYEOF
