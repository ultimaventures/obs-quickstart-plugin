name: Build Plugin

on:
  push:
    branches: [main, sprint-0-template-updates]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: ubuntu-ci-x86_64
            artifact: plugin-linux
          - os: windows-latest
            preset: windows-ci-x64
            artifact: plugin-windows
          - os: macos-latest
            preset: macos-ci
            artifact: plugin-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || matrix.os == 'macos-latest' && 'clang_64' || 'gcc_64' }}

      # --- OBS SDK caching & download ---
      - name: Cache OBS SDK
        id: obs-cache
        uses: actions/cache@v4
        if: matrix.os != 'ubuntu-24.04'
        with:
          path: obs-deps
          key: obs-sdk-${{ runner.os }}-v31.1.1

      - name: Install libobs-dev (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libobs-dev

      - name: Download OBS SDK (Windows/macOS)
        if: (matrix.os == 'windows-latest' || matrix.os == 'macos-latest') && steps.obs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p obs-deps
          if [ "${{ runner.os }}" == "macOS" ]; then
            curl -L -o obs-studio.dmg https://github.com/obsproject/obs-studio/releases/download/31.1.1/OBS-Studio-31.1.1-macOS-Intel.dmg
            # Simplified for now.
          else
            curl -L -o OBS-31.1.1-Windows.zip https://github.com/obsproject/obs-studio/releases/download/31.1.1/OBS-Studio-31.1.1-Windows-x64.zip
            unzip -q OBS-31.1.1-Windows.zip -d obs-deps
          fi

      # --- CMake build ---
      - name: Configure CMake
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.os != 'ubuntu-24.04' && format('-DOBS_SDK_DIR="{0}/obs-deps"', github.workspace) || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix plugin-install

      # --- Package plugin ---
      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp -r plugin-install/* package/
          cd package
          zip -r ../${{ matrix.artifact }}.zip .

      # --- Upload artifacts ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/plugin-linux/plugin-linux.zip
            artifacts/plugin-windows/plugin-windows.zip
            artifacts/plugin-macos/plugin-macos.zip

      - name: Upload to GitLab
        if: env.GITLAB_TOKEN != '' && env.GITLAB_PROJECT_ID != ''
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Uploading plugin artifacts to GitLab release $TAG_NAME"
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          for zipfile in artifacts/*/*.zip; do
            echo "Uploading $zipfile"
            UPLOAD_RESPONSE=$(curl --silent --show-error --fail -X POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --form "file=@$zipfile" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/uploads")
            
            FILE_URL=$(echo $UPLOAD_RESPONSE | jq -r '.url')
            FULL_URL="https://gitlab.com/ultimaventures-playground/obs-quickstart-plugin${FILE_URL}"
            FILE_NAME=$(basename $zipfile)
            
            echo "Attaching $FILE_NAME ($FULL_URL) to GitLab release"
            curl --silent --show-error --fail -X POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              -d "{\"name\":\"$FILE_NAME\",\"url\":\"$FULL_URL\"}" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases/$TAG_NAME/assets/links"
          done
