name: Build Plugin

on:
  push:
    branches: [main, sprint-0-template-updates]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: ubuntu-ci-x86_64
            artifact: plugin-linux
          - os: windows-latest
            preset: windows-ci-x64
            artifact: plugin-windows
          - os: macos-latest
            preset: macos-ci
            artifact: plugin-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || matrix.os == 'macos-latest' && 'clang_64' || 'gcc_64' }}

      # --- OBS SDK caching ---
      - name: Cache OBS SDK
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: obs-deps
          key: obs-sdk-${{ runner.os }}-v29.2.2

      - name: Download OBS SDK if cache miss
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p obs-deps
          cd obs-deps
          if [ "${{ runner.os }}" == "Linux" ]; then
            wget https://cdn-fastly.obsproject.com/downloads/OBS-29.2.2-Linux-SDK.tar.gz
            tar -xzf OBS-29.2.2-Linux-SDK.tar.gz
          elif [ "${{ runner.os }}" == "macOS" ]; then
            curl -L -o OBS-29.2.2-macOS-SDK.zip https://cdn-fastly.obsproject.com/downloads/OBS-29.2.2-macOS-SDK.zip
            unzip OBS-29.2.2-macOS-SDK.zip
          else
            curl -L -o OBS-29.2.2-Windows-SDK.zip https://cdn-fastly.obsproject.com/downloads/OBS-29.2.2-Windows-SDK.zip
            unzip OBS-29.2.2-Windows-SDK.zip
          fi

      # --- CMake build ---
      # We use the preset but override OBS_SDK_DIR to our downloaded SDK.
      # We also force the binary directory to 'build' for simplicity in later steps.
      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }} \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBS_SDK_DIR="${{ github.workspace }}/obs-deps"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix plugin-install

      # --- Package plugin ---
      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp -r plugin-install/* package/
          cd package
          zip -r ../${{ matrix.artifact }}.zip .

      # --- Upload artifacts to GitHub Actions ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/plugin-linux/plugin-linux.zip
            artifacts/plugin-windows/plugin-windows.zip
            artifacts/plugin-macos/plugin-macos.zip

      - name: Upload to GitLab
        if: ${{ secrets.GITLAB_TOKEN && secrets.GITLAB_PROJECT_ID }}
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Uploading plugin artifacts to GitLab release $TAG_NAME"
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          for zipfile in artifacts/*/*.zip; do
            echo "Uploading $zipfile"
            UPLOAD_RESPONSE=$(curl --silent --show-error --fail -X POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --form "file=@$zipfile" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/uploads")
            
            FILE_URL=$(echo $UPLOAD_RESPONSE | jq -r '.url')
            FULL_URL="https://gitlab.com/ultimaventures-playground/obs-quickstart-plugin${FILE_URL}"
            FILE_NAME=$(basename $zipfile)
            
            echo "Attaching $FILE_NAME ($FULL_URL) to GitLab release"
            curl --silent --show-error --fail -X POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              -d "{\"name\":\"$FILE_NAME\",\"url\":\"$FULL_URL\"}" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/releases/$TAG_NAME/assets/links"
          done
