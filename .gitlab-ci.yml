# GitLab CI configuration for the OBS Quickstart Plugin
# ======================================================
# SETUP INSTRUCTIONS FOR YOUR GITLAB ACCOUNT:
# 1. Install GitLab Runner on your Windows and macOS machines.
# 2. Register each runner with your GitLab project (Settings > CI/CD > Runners).
# 3. Use tags 'windows' for the Windows runner and 'macos' for the macOS runner.
# 4. Ensure CMake, a C++17 compiler (MSVC on Windows, Clang on macOS), and libobs 
#    dependencies are installed on the runner machines.
# ======================================================

stages:
  - check
  - build
  - test
  - package

variables:
  BUILD_DIR: build
  CMAKE_BUILD_TYPE: RelWithDebInfo

# Quality check stage mirroring the original GitHub workflow
check:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y clang-format-16
  script:
    - echo "Checking C++ file formatting..."
    - find src -iname '*.cpp' -o -iname '*.hpp' | xargs clang-format-16 --dry-run -Werror

# Windows Build Job
# Requires a runner with the 'windows' tag
build-windows:
  stage: build
  tags:
    - windows
  script:
    - echo "Building for Windows..."
    - cmake -S . -B ${BUILD_DIR} -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}
    - cmake --build ${BUILD_DIR} --config ${CMAKE_BUILD_TYPE}
  artifacts:
    paths:
      - ${BUILD_DIR}/rundir/${CMAKE_BUILD_TYPE}/
    expire_in: 1 week

# macOS Build Job
# Requires a runner with the 'macos' tag
build-macos:
  stage: build
  tags:
    - macos
  script:
    - echo "Building for macOS..."
    - cmake -S . -B ${BUILD_DIR} -G Xcode -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}
    - cmake --build ${BUILD_DIR} --config ${CMAKE_BUILD_TYPE}
  artifacts:
    paths:
      - ${BUILD_DIR}/rundir/${CMAKE_BUILD_TYPE}/
    expire_in: 1 week

# Placeholder for integrated testing as planned in Step #1-3
placeholder_test:
  stage: test
  script:
    - echo "Tests will be added here in future sprints."
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# Placeholder for packaging mirroring the original intent
placeholder_package:
  stage: package
  script:
    - echo "Packaging logic (CPack) will be added here."
  rules:
    - if: $CI_COMMIT_TAG
