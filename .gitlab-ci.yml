# GitLab CI configuration for the OBS Quickstart Plugin
# ======================================================
# NOTE: Main builds and releases are handled via GitHub Actions (.github/workflows).
# This GitLab CI file is primarily for quality checks on the GitLab mirror.
# ======================================================

stages:
  - check
  - gate

variables:
  BUILD_DIR: build

# Quality check stage mirroring the original GitHub workflow
check:
  stage: check
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y clang-format-19
  script:
    - echo "Checking C++ file formatting..."
    # Ensure we're using the correct version of clang-format as per conventions.md
    - find src -iname '*.cpp' -o -iname '*.hpp' | xargs clang-format-19 --dry-run -Werror

# Merge-gate status: GitLab side.
#
# When a ready/* branch is pushed, post the initial `pending` gate status for
# the GitHub 3-OS build. The GitHub workflow resolves it to success/failed via
# the `post-gate-status` job in .github/workflows/push.yaml. The status `name`
# MUST match on both sides: "github/3os-build".
#
# "Pipelines must succeed" then blocks the MR until GitHub reports back, which
# makes the gate fail-closed: a missing final post leaves `pending` forever.
#
# Requires the GITLAB_STATUS_TOKEN CI/CD variable (fine-grained PAT scoped to
# this project with CI/CD -> Commit Status -> Create, Protected + Masked).
# If the token is missing or invalid the POST fails, the pipeline fails, and
# the MR stays blocked.
post-pending-gate-status:
  # Runs in the first stage, in parallel with `check`: the pending status must
  # be posted on every ready/* push even if the check job fails — the GitHub
  # build resolves it to success/failed, and a failed pipeline blocks the MR
  # on its own.
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^ready\//
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl --fail --silent --show-error --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_STATUS_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${CI_COMMIT_SHA}" \
        --data-urlencode "state=pending" \
        --data-urlencode "name=github/3os-build" \
        --data-urlencode "description=GitHub 3-OS build queued — result pending" \
        --data-urlencode "target_url=https://github.com/ultimaventures/obs-quickstart-plugin/actions"
